name: AI Automation Agency

on:
  issue_comment:
    types:
      - created

permissions:
  contents: write
  issues: write

jobs:
  agency:
    if: startsWith(github.event.comment.body, '@agency')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run AI Agency
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CLIENT_REQUEST: ${{ github.event.comment.body }}
        run: |
          python3 <<'PY'
          import os
          import json
          import urllib.request
          import urllib.error

          api_key = os.environ["OPENAI_API_KEY"]
          client_request = os.environ["CLIENT_REQUEST"]

          prompt = f"""
          You are an AI Automation Agency Manager.

          Client request:
          {client_request}

          Create a professional automation plan.

          Include:
          1. Client Requirement
          2. Business Goal
          3. Automation Workflow
          4. Tools Required
          5. AI Components
          6. Implementation Steps
          7. Deliverables
          8. Client Response
          9. Next Action
          """

          payload = {
              "model": "gpt-5.6",
              "input": prompt
          }

          request = urllib.request.Request(
              "https://api.openai.com/v1/responses",
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "Authorization": "Bearer " + api_key,
                  "Content-Type": "application/json"
              },
              method="POST"
          )

          try:
              with urllib.request.urlopen(request) as response:
                  result = json.loads(
                      response.read().decode("utf-8")
                  )
          except urllib.error.HTTPError as error:
              print(error.read().decode("utf-8"))
              raise

          output = result.get("output_text", "")

          if not output:
              output = "AI did not return a response."

          os.makedirs("deliverables", exist_ok=True)

          with open(
              "deliverables/agency-report.md",
              "w",
              encoding="utf-8"
          ) as file:
              file.write("# AI Automation Agency Report\n\n")
              file.write(output)

          print(output)
          PY

      - name: Save Result
        run: |
          git config user.name "AI Automation Agency"
          git config user.email "actions@github.com"
          git add deliverables/agency-report.md
          git commit -m "Generate agency report" || echo "Nothing to commit"
         git push
