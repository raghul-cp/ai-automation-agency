name: AI Automation Agency

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

jobs:
  agency:
    if: ${{ startsWith(github.event.comment.body, '@agency') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate AI Agency Plan
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CLIENT_REQUEST: ${{ github.event.comment.body }}
        run: |
          python3 - <<'PY'
          import os
          import json
          import urllib.request
          import urllib.error

          api_key = os.environ.get("OPENAI_API_KEY")
          client_request = os.environ.get("CLIENT_REQUEST", "")

          if not api_key:
              raise RuntimeError("OPENAI_API_KEY secret is missing")

          prompt = f"""
          You are an AI Automation Agency Manager.

          Client request:
          {client_request}

          Create a professional automation plan.

          Include:

          # Client Requirement
          # Business Goal
          # Automation Workflow
          # Tools Required
          # AI Components
          # Implementation
          # Deliverables
          # Client Response
          # Next Action
          """

          payload = {
              "model": "gpt-5.6",
              "input": prompt
          }

          request = urllib.request.Request(
              "https://api.openai.com/v1/responses",
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "Authorization": "Bearer " + api_key,
                  "Content-Type": "application/json"
              },
              method="POST"
          )

          try:
              with urllib.request.urlopen(request) as response:
                  data = json.loads(response.read().decode("utf-8"))

          except urllib.error.HTTPError as e:
              print("OpenAI API Error:")
              print(e.read().decode("utf-8"))
              raise

          output_text = data.get("output_text", "")

          if not output_text:
              parts = []

              for item in data.get("output", []):
                  if item.get("type") == "message":
                      for content in item.get("content", []):
                          if content.get("type") == "output_text":
                              parts.append(content.get("text", ""))

              output_text = "\n".join(parts)

          if not output_text:
              output_text = "AI returned no text output."

          os.makedirs("deliverables", exist_ok=True)

          with open(
              "deliverables/agency-report.md",
              "w",
              encoding="utf-8"
          ) as file:
              file.write("# AI Automation Agency Report\n\n")
              file.write(output_text)

          print(output_text)
          PY

      - name: Commit Agency Deliverable
        run: |
          git config user.name "AI Automation Agency"
          git config user.email "actions@github.com"

          git add deliverables/agency-report.md

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Generate AI agency report"
            git push
          fi
