name: AI Automation Agency

on:
  issue_comment:
    types:
      - created

permissions:
  contents: write
  issues: write

jobs:
  agency:
    if: ${{ startsWith(github.event.comment.body, '@agency') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate AI automation plan
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CLIENT_REQUEST: ${{ github.event.comment.body }}
        run: |
          jq -n \
            --arg request "$CLIENT_REQUEST" \
            '{
              model: "gpt-6-luna",
              input: ("You are an AI Automation Agency Manager.\n\nAnalyze this client request:\n\n" + $request + "\n\nCreate a professional automation plan with these sections:\n1. Client Requirement\n2. Business Goal\n3. Automation Workflow\n4. Tools Required\n5. AI Components\n6. Implementation Steps\n7. Deliverables\n8. Client Response\n9. Next Action")
            }' > request.json

          curl --fail-with-body \
            -sS \
            https://api.openai.com/v1/responses \
            -H "Authorization: Bearer $OPENAI_API_KEY" \
            -H "Content-Type: application/json" \
            --data @request.json \
            -o response.json

          jq -r '
            .output[]
            | select(.type == "message")
            | .content[]
            | select(.type == "output_text")
            | .text
          ' response.json > agency-report.md

          mkdir -p deliverables

          {
            echo "# AI Automation Agency Report"
            echo ""
            cat agency-report.md
          } > deliverables/agency-report.md

      - name: Save agency report
        run: |
          git config user.name "AI Automation Agency"
          git config user.email "actions@github.com"

          git add deliverables/agency-report.md

          git commit -m "Generate AI agency report" || echo "Nothing to commit"

           git push