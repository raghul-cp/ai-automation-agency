name: AI Agency Command

on:
  issue_comment:
    types: [created]

permissions:
  issues: write
  contents: write

jobs:
  agency:
    if: startsWith(github.event.comment.body, '@agency')
    runs-on: ubuntu-latest

    steps:
      - name: Read Agency Command
        env:
          COMMAND: ${{ github.event.comment.body }}
        run: |
          echo "AI Agency command received:"
          echo "$COMMAND"

      - name: Create Real Agency Deliverables
        uses: actions/github-script@v7
        with:
          script: |
            const command = context.payload.comment.body.trim();
            const request = command.replace(/^@agency\s*/i, '').trim();
            const issueNumber = context.issue.number;

            const text = request.toLowerCase();

            let business = "General Business";
            let automation = "Business Process Automation";
            let channel = "WhatsApp / Email";

            if (text.includes("gym") || text.includes("fitness")) {
              business = "Gym / Fitness Business";
            } else if (text.includes("real estate") || text.includes("property")) {
              business = "Real Estate Business";
            } else if (text.includes("salon") || text.includes("beauty")) {
              business = "Salon / Beauty Business";
            } else if (text.includes("restaurant") || text.includes("hotel")) {
              business = "Restaurant / Hospitality Business";
            } else if (
              text.includes("ecommerce") ||
              text.includes("e-commerce") ||
              text.includes("shop") ||
              text.includes("store")
            ) {
              business = "E-commerce Business";
            }

            if (text.includes("whatsapp")) {
              channel = "WhatsApp";
            } else if (text.includes("email")) {
              channel = "Email";
            } else if (text.includes("instagram")) {
              channel = "Instagram";
            } else if (text.includes("telegram")) {
              channel = "Telegram";
            }

            if (text.includes("lead")) {
              automation = "Lead Generation & Follow-up Automation";
            } else if (
              text.includes("appointment") ||
              text.includes("booking")
            ) {
              automation = "Appointment Booking Automation";
            } else if (text.includes("follow")) {
              automation = "Customer Follow-up Automation";
            } else if (text.includes("support")) {
              automation = "Customer Support Automation";
            } else if (text.includes("sales")) {
              automation = "Sales Automation";
            }

            const basePath = `deliverables/issue-${issueNumber}`;

            const proposal = `# Client Proposal

## Business
${business}

## Client Request
${request}

## Automation
${automation}

## Communication Channel
${channel}

## Objective

Build a repeatable automation system for the client's business.

## Proposed Solution

1. Capture customer/lead information.
2. Process the incoming request.
3. Apply business rules.
4. Send an automated response.
5. Store customer information.
6. Trigger follow-up actions.
7. Notify the business team when human action is required.

## Expected Benefits

- Faster response time
- Reduced manual work
- Better lead management
- Consistent customer communication
- Organized business data
`;

            const workflow = `# Automation Workflow

## Business
${business}

## Automation
${automation}

## Channel
${channel}

## Flow

Customer
  ↓
Incoming Request
  ↓
Data Capture
  ↓
Validation
  ↓
Automation Rules
  ↓
Automatic Response
  ↓
CRM / Database
  ↓
Follow-up
  ↓
Human Notification

## Required Data

- Customer name
- Phone number
- Email
- Customer request
- Date/time
- Lead status
- Follow-up status

## Rules

IF a new request arrives
→ capture customer information

IF the request is valid
→ send automatic response

IF follow-up is required
→ create follow-up task

IF human assistance is required
→ notify business team
`;

            const clientMessage = `# Client Message

Hello,

We reviewed your requirement for:

**${business}**

Requested automation:

**${automation}**

Communication channel:

**${channel}**

We have prepared the initial automation workflow and implementation plan.

The next step is to connect the required business accounts, APIs and tools for deployment.

Thank you.
`;

            const implementationGuide = `# Implementation Guide

## Business
${business}

## Automation
${automation}

## Channel
${channel}

## Deployment Steps

### 1. Collect Business Information
- Business name
- Contact details
- Working hours
- Customer journey
- Follow-up rules

### 2. Configure Communication
Connect the required communication platform.

### 3. Configure Data Storage
Connect CRM, database or Google Sheets.

### 4. Configure Automation
Create triggers, conditions and actions.

### 5. Configure Follow-up
Define timing and follow-up rules.

### 6. Test
Test the complete workflow with sample customer data.

### 7. Deploy
Enable the workflow for real customer traffic.

### 8. Monitor
Review errors, delivery status and automation performance.
`;

            const automationConfig = {
              agency: "AI Automation Agency",
              issue: issueNumber,
              request: request,
              business: business,
              automation: automation,
              channel: channel,
              status: "READY_FOR_INTEGRATION",
              deliverables: [
                "client-proposal.md",
                "automation-workflow.md",
                "client-message.md",
                "implementation-guide.md",
                "automation.json"
              ]
            };

            async function upsertFile(path, content) {
              let sha;

              try {
                const existing = await github.rest.repos.getContent({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  path: path,
                  ref: context.sha
                });

                if (!Array.isArray(existing.data)) {
                  sha = existing.data.sha;
                }
              } catch (error) {
                if (error.status !== 404) {
                  throw error;
                }
              }

              const params = {
                owner: context.repo.owner,
                repo: context.repo.repo,
                path: path,
                message: `Create agency deliverable: issue #${issueNumber}`,
                content: Buffer.from(content, "utf8").toString("base64"),
                branch: context.payload.repository.default_branch
              };

              if (sha) {
                params.sha = sha;
              }

              await github.rest.repos.createOrUpdateFileContents(params);
            }

            await upsertFile(
              `${basePath}/client-proposal.md`,
              proposal
            );

            await upsertFile(
              `${basePath}/automation-workflow.md`,
              workflow
            );

            await upsertFile(
              `${basePath}/client-message.md`,
              clientMessage
            );

            await upsertFile(
              `${basePath}/implementation-guide.md`,
              implementationGuide
            );

            await upsertFile(
              `${basePath}/automation.json`,
              JSON.stringify(automationConfig, null, 2)
            );

            const response = `## 🤖 AI Automation Agency

**Business:** ${business}

**Automation:** ${automation}

**Channel:** ${channel}

### Deliverables Created

✅ Client Proposal  
✅ Automation Workflow  
✅ Client Message  
✅ Implementation Guide  
✅ Automation Configuration

### Location

\`${basePath}/\`

### Status

🟢 **READY FOR INTEGRATION**

The automation plan has been generated and saved in the repository.

Next stage: connect the required external APIs and business tools for real deployment.`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: response
            });