name: AI Automation Agency

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

jobs:
  agency:
    if: startsWith(github.event.comment.body, '@agency')
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

       - name: Get client command
        id: command
        env:
          COMMENT: ${{ github.event.comment.body }}
        run: |
          {
            echo "command<<EOF"
            echo "$COMMENT"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Send request to OpenAI
        id: ai
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CLIENT_COMMAND: ${{ steps.command.outputs.command }}
        run: |
          python - <<'PY'
          import os
          import json
          import urllib.request

          api_key = os.environ["OPENAI_API_KEY"]
          command = os.environ["CLIENT_COMMAND"]

          prompt = f"""
          You are the AI Automation Agency manager.

          Analyze this client request:

          {command}

          Create a professional automation plan.

          Include:

          1. Client Requirement
          2. Business Goal
          3. Automation Workflow
          4. Tools Required
          5. Step-by-Step Implementation
          6. AI Components
          7. Expected Result
          8. Client Deliverables
          9. Estimated Complexity
          10. Next Action

          Make the response practical and ready for an automation agency.
          """

          data = {
              "model": "gpt-6-luna",
              "input": prompt
          }

          request = urllib.request.Request(
              "https://api.openai.com/v1/responses",
              data=json.dumps(data).encode(),
              headers={
                  "Authorization": f"Bearer {api_key}",
                  "Content-Type": "application/json"
              },
              method="POST"
          )

          with urllib.request.urlopen(request) as response:
              result = json.loads(response.read().decode())

          output = result.get("output_text", "")

          if not output:
              output = json.dumps(result, indent=2)

          with open("agency_result.md", "w", encoding="utf-8") as f:
              f.write("# AI Automation Agency Report\n\n")
              f.write(output)

          print(output)
          PY

      - name: Create deliverable
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          mkdir -p "deliverables/issue-${ISSUE_NUMBER}"
          mv agency_result.md "deliverables/issue-${ISSUE_NUMBER}/agency-report.md"

      - name: Commit agency deliverable
        run: |
          git config user.name "AI Automation Agency"
          git config user.email "actions@github.com"

          git add deliverables/

          git diff --cached --quiet || git commit -m "Create AI agency deliverable"

          git push