name: AI Agency Command

on:
  issue_comment:
    types:
      - created

permissions:
  contents: write
  issues: write

jobs:
  agency:
    if: ${{ startsWith(github.event.comment.body, '@agency') }}
    runs-on: ubuntu-latest

    steps:
      - name: Read Agency Command
        run: |
          echo "AI Agency command received:"
          echo "${{ github.event.comment.body }}"

      - name: Generate Agency Deliverables
        uses: actions/github-script@v7
        with:
          script: |
            const command = context.payload.comment.body.trim();
            const request = command.replace(/^@agency\s*/i, '').trim();
            const issueNumber = context.issue.number;

            let business = "General Business";
            let automation = "Business Process Automation";

            const text = request.toLowerCase();

            if (text.includes("gym") || text.includes("fitness")) {
              business = "Gym / Fitness Business";
            }

            if (text.includes("lead")) {
              automation = "Lead Generation & Follow-up Automation";
            }

            const basePath = `deliverables/issue-${issueNumber}`;

            const proposal = `# Client Proposal

## Business
${business}

## Client Request
${request}

## Automation
${automation}

## Objective
Create an automated lead generation system for the client.

## Proposed Solution

1. Capture new customer information.
2. Store lead information.
3. Send an automatic response.
4. Follow up with the lead.
5. Notify the business team when required.
`;

            const workflow = `# Automation Workflow

## Business
${business}

## Automation
${automation}

## Flow

Customer
↓
Lead Capture
↓
Data Validation
↓
Lead Storage
↓
Automatic Response
↓
Follow-up
↓
Business Notification

## Required Data

- Customer name
- Phone number
- Email
- Lead source
- Lead status
- Follow-up status
`;

            const clientMessage = `# Client Message

Hello,

We reviewed your requirement for:

**${business}**

Requested automation:

**${automation}**

We have prepared the initial automation workflow and implementation plan.

The next step is to connect the required business accounts, APIs and tools.

Thank you.
`;

            const implementationGuide = `# Implementation Guide

## Business
${business}

## Automation
${automation}

## Steps

### 1. Collect Business Information
- Business name
- Contact details
- Working hours
- Lead sources

### 2. Connect Lead Source
Connect the required form, website or social media source.

### 3. Store Leads
Connect CRM, database or Google Sheets.

### 4. Configure Automation
Create triggers and actions.

### 5. Configure Follow-up
Create automatic follow-up messages.

### 6. Test
Test the workflow using sample leads.

### 7. Deploy
Enable the automation for real customers.

### 8. Monitor
Check errors and automation performance.
`;

            const automationConfig = {
              agency: "AI Automation Agency",
              issue: issueNumber,
              request: request,
              business: business,
              automation: automation,
              status: "READY_FOR_INTEGRATION",
              deliverables: [
                "client-proposal.md",
                "automation-workflow.md",
                "client-message.md",
                "implementation-guide