name: AI Agency Command

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

jobs:
  agency:
    if: startsWith(github.event.comment.body, '@agency')
    runs-on: ubuntu-latest

    steps:
      - name: Read command
        run: |
          echo "AI Agency command received:"
          echo "${{ github.event.comment.body }}"

      - name: Generate agency output
        uses: actions/github-script@v7
        with:
          script: |
            const command = context.payload.comment.body.trim();
            const request = command.replace(/^@agency\s*/i, '').trim();
            const issueNumber = context.issue.number;

            let business = "General Business";
            let automation = "Business Automation";

            if (/gym|fitness/i.test(request)) {
              business = "Gym / Fitness Business";
            }

            if (/lead/i.test(request)) {
              automation = "Lead Generation Automation";
            }

            const path = `deliverables/issue-${issueNumber}`;

            const files = {
              "client-proposal.md": `# Client Proposal

Business: ${business}

Client Request:
${request}

Automation:
${automation}

## Objective
Create an automated lead generation system for the client.
`,

              "automation-workflow.md": `# Automation Workflow

${business}

${automation}

Customer
↓
Lead Capture
↓
Lead Storage
↓
Automatic Response
↓
Follow-up
↓
Business Notification
`,

              "client-message.md": `# Client Message

Hello,

We received your requirement:

${request}

We have prepared the initial automation plan.

Thank you.
`,

              "implementation-guide.md": `# Implementation Guide

## Business
${business}

## Automation
${automation}

## Steps

1. Collect customer information.
2. Capture leads.
3. Store leads.
4. Send automatic response.
5. Follow up with leads.
6. Notify the business.
7. Test the workflow.
8. Deploy the automation.
`,

              "automation.json": JSON.stringify({
                agency: "AI Automation Agency",
                issue: issueNumber,
                request: request,
                business: business,
                automation: automation,
                status: "READY_FOR_INTEGRATION"
              }, null, 2)
            };

            for (const [filename, content] of Object.entries(files)) {
              const filePath = `${path}/${filename}`;
              let sha;

              try {
                const existing = await github.rest.repos.getContent({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  path: filePath,
                  ref: context.payload.repository.default_branch
                });

                if (!Array.isArray(existing.data)) {
                  sha = existing.data.sha;
                }
              } catch (error) {
                if (error.status !== 404) {
                  throw error;
                }
              }

              const data = {
                owner: context.repo.owner,
                repo: context.repo.repo,
                path: filePath,
                message: `AI Agency: create ${filename}`,
                content: Buffer.from(content).toString("base64"),
                branch: context.payload.repository.default_branch
              };

              if (sha) {
                data.sha = sha;
              }

              await github.rest.repos.createOrUpdateFileContents(data);
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: `## 🤖 AI Agency

✅ Command received

**Business:** ${business}

**Automation:** ${automation}

### Created
- ✅ Client Proposal
- ✅ Automation Workflow
- ✅ Client Message
- ✅ Implementation Guide
- ✅ Automation JSON

📁 Files created in:
\`${path}/\`

🟢 **Status: READY FOR INTEGRATION**`
            });