name: AI Automation Agency

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

jobs:
  agency:
    if: startsWith(github.event.comment.body, '@agency')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create AI Report
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CLIENT_REQUEST: ${{ github.event.comment.body }}
        run: |
          python3 -c 'import json,os; json.dump({"model":"gpt-6-luna","input":"You are an AI Automation Agency Manager. Analyze this client request and create: Client Requirement, Business Goal, Automation Workflow, Tools Required, AI Components, Implementation Steps, Deliverables, Client Response and Next Action.\n\nClient request: "+os.environ["CLIENT_REQUEST"]},open("request.json","w"))'

          curl -sS https://api.openai.com/v1/responses \
            -H "Authorization: Bearer $OPENAI_API_KEY" \
            -H "Content-Type: application/json" \
            -d @request.json \
            -o response.json

          python3 -c 'import json; d=json.load(open("response.json")); open("agency-report.md","w").write("# AI Automation Agency Report\n\n"+d.get("output_text","AI did not return text."))'

          mkdir -p deliverables
          mv agency-report.md deliverables/agency-report.md

      - name: Save Report
        run: |
          git config user.name "AI Automation Agency"
          git config user.email "actions@github.com"
          git add deliverables/agency-report.md
          git commit -m "Generate agency report" || true
          git push
